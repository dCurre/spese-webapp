<div class="modal-header">
    <h5 class="modal-title">
        <i class="fa fa-box"></i>
        {{ isEdit ? 'Modifica prodotto' : 'Nuovo prodotto' }}
    </h5>
    <button class="modal-close-btn" (click)="modal.dismiss()">
        <i class="fa fa-times"></i>
    </button>
</div>

<div class="modal-body">
    <div class="form-group">
        <label class="form-label">Nome prodotto <span class="required">*</span></label>
        <input
            class="form-input"
            type="text"
            placeholder="Es. Parmigiano Reggiano 1kg"
            [(ngModel)]="name"
            autofocus
        />
    </div>

    <div class="form-group">
        <label class="form-label">Brand / Marca</label>
        <input
            class="form-input"
            type="text"
            placeholder="Es. Grana Padano"
            [(ngModel)]="brand"
        />
    </div>

    <div class="form-group">
        <label class="form-label">Unità di misura <span class="required">*</span></label>
        <select class="form-select" [(ngModel)]="defaultUnitId">
            <option [ngValue]="null" disabled>— Seleziona —</option>
            <option *ngFor="let u of units" [ngValue]="u.id">
                {{ u.name }} ({{ u.symbol }})
            </option>
        </select>
    </div>
</div>

<div class="modal-footer">
    <button class="btn-cancel" (click)="modal.dismiss()">Annulla</button>
    <button class="btn-save" (click)="save()" [disabled]="!canSave">
        <i class="fa fa-check"></i>
        {{ isEdit ? 'Salva modifiche' : 'Crea prodotto' }}
    </button>
</div>
