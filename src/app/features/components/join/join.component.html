<div class="join-page">
    <div class="join-card" *ngIf="invite">
        <div class="join-icon">
            <i class="fa fa-users"></i>
        </div>
        <h2 class="join-title">Unisciti alla lista</h2>
        <p class="join-list-name">{{ invite.name }}</p>
        <p class="join-participants">
            <i class="fa fa-user"></i>
            {{ invite.participants_count }} partecipanti
        </p>
        <button class="join-btn" (click)="join()">
            <i class="fa fa-right-to-bracket"></i> Partecipa
        </button>
    </div>
    <app-spinner *ngIf="!invite"></app-spinner>
</div>
